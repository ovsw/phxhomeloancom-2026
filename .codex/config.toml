[mcp_servers.sanity]
command = "sh"
args = [
  "-c",
  ". ./.env; test -n \"${SANITY_AUTH_TOKEN:-}\" || { printf '%s' 'SANITY_AUTH_TOKEN is missing'; exit 1; }; export SANITY_AUTH_TOKEN; exec npx -y mcp-remote@0.1.38 https://mcp.sanity.io --transport http-only --header \"Authorization: Bearer \\${SANITY_AUTH_TOKEN}\"",
]
cwd = "studio"
default_tools_approval_mode = "writes"
